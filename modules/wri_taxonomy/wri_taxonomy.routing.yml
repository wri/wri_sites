wri_taxonomy.move_term_form:
  path: '/admin/structure/taxonomy/move'
  defaults:
    _form: '\Drupal\wri_taxonomy\Form\MoveTermForm'
    _title: 'MoveTermForm'
  requirements:
    _permission: 'administer taxonomy'

wri_taxonomy.settings:
  path: '/admin/config/system/wri-taxonomy'
  defaults:
    _title: 'WRI taxonomy settings'
    _form: 'Drupal\wri_taxonomy\Form\WriTaxonomySettingsForm'
  requirements:
    _permission: 'administer site configuration'
