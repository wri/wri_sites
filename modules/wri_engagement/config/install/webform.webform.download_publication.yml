id: download_publication
title: 'Download publication'
description: ''
categories: {  }
elements: |-
  download_list:
    '#type': container
    '#attributes':
      class:
        - downloads-list
    downloads:
      '#type': view
      '#name': node_downloads
      '#display_id': default
      '#arguments':
        - '[webform_submission:source-id]'
  submission_form:
    '#type': container
    '#attributes':
      class:
        - downloads-submission-form
    email:
      '#type': email
      '#title': Email
      '#required': true
    flexbox:
      '#type': webform_flexbox
      first_name:
        '#type': textfield
        '#title': 'First name'
        '#required': true
      last_name:
        '#type': textfield
        '#title': 'Last name'
        '#required': true
    flexbox_01:
      '#type': webform_flexbox
      job_title:
        '#type': textfield
        '#title': 'Job title'
      organization:
        '#type': textfield
        '#title': Organization
    sector_affiliation:
      '#type': select
      '#title': 'Sector / Affiliation'
      '#options': sector
      '#required': true
    markup:
      '#type': webform_markup
      '#markup': '<h5>By sharing your information you agree to receive updates from WRI. You can change your email preferences at any time.</h5>'
    actions:
      '#type': webform_actions
      '#title': 'Submit button(s)'
      '#submit__label': 'Sign up'
      '#submit__attributes':
        class:
          - gtm-modal-download-files
    processed_text:
      '#type': processed_text
      '#text': |
        <p><a id="skip-registration">No thanks. Proceed to download.</a></p>
      '#format': full_html
  source_origin:
    '#type': hidden
    '#title': 'Source origin'
    '#default_value': Website
  source_type:
    '#type': hidden
    '#title': 'Source type'
    '#default_value': 'Research Publication Download - WRI.org'
  source_details:
    '#type': hidden
    '#title': 'Source details'
    '#default_value': '[webform_submission:source-entity:title]'
  source_interest:
    '#type': hidden
    '#title': 'Source interest'
    '#default_value': '[webform_submission:source-entity:field_primary_topic:entity:name]'
css: ''
javascript: "function getEmailValue(event) {\r\n// Prevent the default form submission\r\n      event.preventDefault();\r\n    // Get the email input field\r\n    const emailInput = document.querySelector('input[name=\"email\"]');\r\n\r\n    // Get the value of the email input field\r\n    const emailValue = emailInput.value;\r\n\r\n    // Output the email value (for demonstration purposes)\r\n    console.log(emailValue);\r\n  alert('click');\r\n\r\n    // You can now use the emailValue for further processing, e.g., AJAX submission\r\n  }\r\n\r\n  // Add event listener to the submit button\r\n  const submitButton = document.querySelector('input.webform-button--submit[name=\"op\"]');\r\nif (submitButton) {\r\n      submitButton.addEventListener('click', getEmailValue);\r\n      console.log('Submit button found');\r\n    } else {\r\n      console.error('Submit button not found');\r\n    }"
