status: true
dependencies:
  module:
    - node
id: careers_job_content_type
label: 'Careers Job Content Type'
code: |-
  // Function to find a label and remove it + the text immediately following it
  function hideFieldAndValue(labelText) {
      const labels = document.querySelectorAll('.list-of-fields-sidebar .field-label-above');
      labels.forEach(label => {
          if (label.textContent.trim() === labelText) {
              // 1. Get the text node that follows this div
              let nextNode = label.nextSibling;
              // 2. Clear the text node (the value like "Operations" or "False")
              if (nextNode) {
                  nextNode.textContent = '';
              }
              // 3. Hide the label itself ("Job Function" or "Job is Closed")
              label.style.display = 'none';
          }
      });
  }

  // Shift the displayed "Application Deadline" back by one calendar day.
  // Note: the deadline value lives in a <time> element that is the label's
  // nextElementSibling (not a plain text sibling like the fields above),
  // so it needs its own traversal logic.
  function shiftApplicationDeadline() {
      const labels = document.querySelectorAll('.list-of-fields-sidebar .field-label-above');
      const months = ['January','February','March','April','May','June','July',
                      'August','September','October','November','December'];
      labels.forEach(label => {
          if (label.textContent.trim() === 'Application Deadline') {
              const timeEl = label.nextElementSibling;
              if (timeEl && timeEl.tagName === 'TIME' && timeEl.textContent) {
                  const match = timeEl.textContent.match(
                      /(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),\s+(\d{4})/
                  );
                  if (match) {
                      const monthIndex = months.indexOf(match[1]);
                      const day = parseInt(match[2], 10);
                      const year = parseInt(match[3], 10);
                      const d = new Date(Date.UTC(year, monthIndex, day));
                      d.setUTCDate(d.getUTCDate() - 1);
                      const newText = months[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear();
                      timeEl.textContent = timeEl.textContent.replace(match[0], newText);
                  }
              }
          }
      });
  }

  // NEW: If the (corrected) Application Deadline has passed, hide the Apply
  // button/link and replace it with a "no longer accepting applications" notice.
  //
  // This intentionally runs AFTER shiftApplicationDeadline() and re-reads the
  // <time> element's text (rather than re-deriving the -1-day correction on
  // its own) so the "has it passed?" check always agrees with the deadline
  // date a visitor can actually see on the page — no risk of the two pieces
  // of logic drifting a day apart from each other.
  //
  // A deadline "passes" at the end (23:59:59 UTC) of the listed day, so the
  // Apply button stays visible for the entirety of the deadline date itself
  // and only flips over starting the next day.
  function hideApplyIfDeadlinePassed() {
      const labels = document.querySelectorAll('.list-of-fields-sidebar .field-label-above');
      const months = ['January','February','March','April','May','June','July',
                      'August','September','October','November','December'];
      labels.forEach(label => {
          if (label.textContent.trim() === 'Application Deadline') {
              const timeEl = label.nextElementSibling;
              if (timeEl && timeEl.tagName === 'TIME' && timeEl.textContent) {
                  const match = timeEl.textContent.match(
                      /(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),\s+(\d{4})/
                  );
                  if (match) {
                      const monthIndex = months.indexOf(match[1]);
                      const day = parseInt(match[2], 10);
                      const year = parseInt(match[3], 10);
                      const deadlineEnd = new Date(Date.UTC(year, monthIndex, day, 23, 59, 59));

                      if (new Date() > deadlineEnd) {
                          // Find the primary "Apply" call-to-action link.
                          const applyLink = Array.from(document.querySelectorAll('a')).find(
                              a => a.textContent.trim() === 'Apply'
                          );
                          if (applyLink && applyLink.style.display !== 'none') {
                              // Styled to look like the button it's replacing (reuses the
                              // same "button button--primary" classes already on the page,
                              // minus "offsite" so no external-link icon is implied), but it
                              // is a plain, non-interactive <span> — no href, no click
                              // behavior, and pointer-events/cursor are explicitly disabled
                              // as a defensive measure in case any other script on the page
                              // attaches generic click handlers to ".button" elements.
                              const notice = document.createElement('span');
                              notice.className = 'button button--primary application-closed-message';
                              notice.textContent = 'This position is no longer accepting applications';
                              notice.style.pointerEvents = 'none';
                              notice.style.cursor = 'default';
                              applyLink.insertAdjacentElement('afterend', notice);
                              applyLink.style.display = 'none';
                          }
                      }
                  }
              }
          }
      });
  }

  // Execute for your two specific fields (unchanged)
  hideFieldAndValue("Job Function");
  hideFieldAndValue("Job is Closed");

  // Unchanged: cosmetic -1 day correction on the displayed deadline text
  shiftApplicationDeadline();

  // New: hide Apply / show closed-notice once that corrected deadline has passed
  hideApplyIfDeadlinePassed();
noscript: ''
noscriptRegion: {  }
jquery: false
header: false
