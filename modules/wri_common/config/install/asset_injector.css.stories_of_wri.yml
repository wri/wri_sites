status: true
dependencies:
  module:
    - system
id: stories_of_wri
label: 'Stories of WRI'
code: |
  video{
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100vw;
    height: 100%;
    z-index: -100;
    object-fit: cover;
  }


  .gold-bar {
      background: linear-gradient(to right, #eb8026, #efac1f);
      color: #1a1919;
  }

  .landing-page__content.grid.margin-top-md.margin-bottom-md {
      margin-bottom: 0;
  }

  table.stories-wri-table figure img {
      height: 350px !important;
      width: 100%;
      object-fit: cover;
      vertical-align: center;
  }

  .story-covershot img{
  box-shadow: rgba(0, 0, 0, 0.7) 5px 7px 10px 5px;
  }

  @media (min-width: 768px){
  .stories-wri-block {
      width: 75%;
      margin: 0 auto;
  }

  table figure {
  	margin: 1.25em 0px !important;
  }

  table.stories-wri-table {
      width: 100vw;
  }

  table.stories-wri-table td {
      vertical-align: top;
  }

  table.stories-wri-table td:nth-child(even) {
      padding-left: 1px;
  }

  table.stories-wri-table td:nth-child(odd) {
      padding-right: 1px;
  }
  }

  @media (min-width: 768px){

  table.stories-wri-table td {
      width: 50%;
  }
  }

  @media (max-width: 767px){

  table.stories-wri-table td {
      display: block;
      padding: 0px;
  }

  figure{
  	margin: 1em 0px;
  }
  }

  /* Preview Cards */

  table.stories-of-wri-preview td {
      vertical-align: top;
  }

  table.stories-of-wri-preview td img {
      object-fit: cover;
  }

  @media (min-width: 768px){
  	table.stories-of-wri-preview td {
      width: 20%;
  }
  table.stories-of-wri-preview td img {
      height: 300px !important;
  }
  }

  @media (max-width: 767px){

  article.stories-of-wri-previews.media.media--type-embed.media--view-mode-full-width {
      margin-right: unset;
      margin-left: unset;
      right: unset;
      left: unset;
      width: 100%;
  }

  table.stories-of-wri-preview td {
      display: block;
      padding: 10px 0px !important;
  }
  table.stories-of-wri-preview td img {
      height: 200px !important;
  }
  }


  /* GHG Page */


  .stories-ghg-table {
      background: #00ABA1;
  }


  /* GFW Page */


  .stories-gfw-table {
      background: #acbc8b;
  }

  /* Initiative 20x20 Page */

  .stories-in2020-table {
      background: #7499bc;
  }
media: all
preprocess: true
conditions:
  request_path:
    id: request_path
    negate: false
    pages: "/stories-changed-world\r\n/stories-changed-world/*\r\n"
contexts: {  }
conditions_require_all: true
