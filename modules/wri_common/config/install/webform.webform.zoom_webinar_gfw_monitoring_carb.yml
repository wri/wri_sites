id: zoom_webinar_gfw_monitoring_carb
title: 'Zoom Webinar Registration (GFW) - Monitoring Carbon in Restoration webinar'
description: ''
categories: {  }
elements: |-
  header:
    '#type': webform_markup
    '#markup': '<h2>Register for this webinar</h2>'
  email:
    '#type': email
    '#title': Email
    '#required': true
    '#required_error': 'Please enter an email'
  email_opt_in:
    '#type': checkbox
    '#title': "I'd like to receive related event invites, news and updates from Global Forest Watch and World Resources Institute via email (you can opt-out at any time)"
    '#return_value': '1'
  flexbox:
    '#type': webform_flexbox
    first_name:
      '#type': textfield
      '#title': 'First Name'
      '#required': true
      '#required_error': 'Please enter a First Name'
    last_name:
      '#type': textfield
      '#title': 'Last Name'
      '#required': true
      '#required_error': 'Please enter a last name'
  flexbox_01:
    '#type': webform_flexbox
    org:
      '#type': textfield
      '#title': Organization
      '#description': '<p>Please include the full name of your organization (no acronym please)</p>'
      '#required': true
    job_title:
      '#type': textfield
      '#title': 'Job Title'
  city:
    '#type': textfield
    '#title': City
  country:
    '#type': select
    '#title': Country
    '#options': country_names
    '#required': true
  best_describes_org:
    '#type': webform_select_other
    '#title': 'Which best describes your organization?'
    '#options':
      Government: Government
      'Donor Institution/Agency': 'Donor Institution/Agency'
      'Local NGO (National or Subnational)': 'Local NGO (National or Subnational)'
      'International NGO': 'International NGO'
      'UN or International Organization': 'UN or International Organization'
      'Academic/Research Organization': 'Academic/Research Organization'
      'Journalist/Media Organization': 'Journalist/Media Organization'
      'Indigenous or Community-Based Organization': 'Indigenous or Community-Based Organization'
      'Private Sector': 'Private Sector'
      'No Affiliation': 'No Affiliation'
    '#other__title': 'Describe your organization'
    '#other__placeholder': ''
    '#required': true
    '#required_error': 'Please select an option'
  help_work_or_hope_to_learn:
    '#type': textarea
    '#title': 'How do you think this webinar will help your work, and what do you hope to learn?'
  gender:
    '#type': webform_select_other
    '#title': 'With which gender do you most identify?'
    '#options':
      Woman: Woman
      Man: Man
      Non-binary: Non-binary
      'Prefer not to say': 'Prefer not to say'
    '#other__option_label': 'Prefer to self-describe'
    '#other__title': 'Describe your gender'
    '#other__placeholder': ''
    '#required': true
    '#required_error': 'Please select a Gender'
  preferred_language:
    '#type': select
    '#title': 'What is your preferred language? Please note most of our communications are in English.'
    '#options': translations
  frequency_of_use:
    '#type': select
    '#title': 'How frequently do you use GFW tools (map and dashboards, Forest Watcher, GFW Pro)?'
    '#options':
      Daily: Daily
      'At least once a week': 'At least once a week'
      'At least once a month': 'At least once a month'
      'Less than once a month ': 'Less than once a month '
      'Interested in GFW but have not yet used it': 'Interested in GFW but have not yet used it'
  markup:
    '#type': webform_markup
    '#markup': '<p>By registering for this webinar, you agree to receive essential emails related to this event (e.g., confirmation, access details, follow-ups) from World Resources Institute and Global Forest Watch.</p>'
  address:
    '#type': textfield
    '#title': Address
  webinar_name:
    '#type': hidden
    '#title': 'Webinar Name'
    '#default_value': '[webform_submission:source-entity:title]'
  webinar_date:
    '#type': hidden
    '#title': 'Webinar Date'
    '#default_value': '[webform_submission:source-entity:field_date_time:format:default]'
  ip_addr:
    '#type': ip_address
    '#title': 'Ip Addr'
  browser_language:
    '#type': hidden
    '#title': 'Browser Language'
    '#attributes':
      class:
        - set-language
    '#attached':
      library:
        - wri_zoom/get_browser_lang
  webinar_id:
    '#type': hidden
    '#title': 'Webinar Id'
    '#default_value': '[webform_submission:source-entity:field_zoom_webinar_id]'
  webinar_topic:
    '#type': hidden
    '#title': 'Webinar topic'
    '#default_value': '[webform_submission:source-entity:field_primary_topic:entity:term_parent_or_self]'
  utm_campaign:
    '#type': hidden
    '#title': utm_campaign
    '#prepopulate': true
  utm_source:
    '#type': hidden
    '#title': utm_source
    '#prepopulate': true
  utm_medium:
    '#type': hidden
    '#title': utm_medium
    '#prepopulate': true
  webinar_region:
    '#type': hidden
    '#title': Region
    '#default_value': '[webform_submission:source-entity:field_region:entity:name]'
  interests:
    '#type': hidden
    '#title': interests
    '#default_value': 'GFW - Carbon and Climate,GFW - Landscape Restoration,LCL - Climate Finance for Nature,LCL - Landscape Restoration'
  list:
    '#type': hidden
    '#title': list
    '#default_value': '[webform_submission:source-entity:field_zoom_list_id]'
