id: data_lab_updates_form
title: 'Sign up to receive Data Lab updates'
description: '<p>Main sign-up form for Data Lab updates</p>'
categories: {  }
elements: |-
  '#attributes':
    class:
      - pardot-form-gtm
  email:
    '#type': email
    '#title': Email
    '#required': true
    '#required_error': 'Please provide your email address'
    '#label_attributes':
      class:
        - label-above
  flexbox:
    '#type': webform_flexbox
    first_name:
      '#type': textfield
      '#title': 'First Name'
      '#required': true
      '#required_error': 'Please provide your first name'
      '#label_attributes':
        class:
          - label-above
    last_name:
      '#type': textfield
      '#title': 'Last Name'
      '#required': true
      '#required_error': 'Please provide your last name'
      '#label_attributes':
        class:
          - label-above
  flexbox_01:
    '#type': webform_flexbox
    job_title:
      '#type': textfield
      '#title': 'Job Title'
      '#required': true
      '#required_error': 'Please provide your job title, or n/a if not applicable'
      '#label_attributes':
        class:
          - label-above
    company:
      '#type': textfield
      '#title': Organization
      '#required': true
      '#required_error': 'Please provide your company or organization name'
      '#label_attributes':
        class:
          - label-above
  sector:
    '#type': select
    '#title': Sector
    '#options': sector
  water:
    '#type': checkboxes_string
    '#title': Interests
    '#options':
      'DATA - Open Data': 'Open Data'
      'DATA - Applications': Applications
      'DATA - Open Data Infrastructure': 'Open Data Infrastructure'
      'DATA - AI for Climate Action': 'AI for Climate Action'
      "DATA - The people and process behind WRI's data products": "The people and process behind WRI's data products"
  markup:
    '#type': webform_markup
    '#markup': '<h5>By sharing your information you agree to receive updates from WRI. You can change your email preferences at any time.</h5>'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__attributes':
      class:
        - wri-digest-form-submit-button
